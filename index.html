<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copus — Confirming your account</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0D1B3E;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 32px; font-weight: 700; color: #ffa500; margin-bottom: 16px; }
    .message { font-size: 18px; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #8896BB; }
  </style>
</head>
<body>
  <img src="https://auth.copus.dev/logo.png" alt="Copus" style="width: 80px; margin-bottom: 16px;" />
  <div class="logo">Copus</div>
  <div class="message">Confirming your account...</div>
  <div class="sub">You will be redirected to the app shortly.</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.substring(1));

    const token = params.get('token') || hash.get('access_token');
    const type = params.get('type') || hash.get('type') || 'signup';
    const tokenHash = params.get('token_hash') || token;

    if (tokenHash) {
      window.location.href = `copus://auth?token_hash=${tokenHash}&type=${type}`;
    } else {
      document.querySelector('.message').textContent = 'Something went wrong.';
      document.querySelector('.sub').textContent = 'Please return to the app and try signing up again.';
    }
  </script>
</body>
</html>
